<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>LineTrans Terminal</title>
<link rel="stylesheet" href="web_terminal/xterm.css">
<style>
  :root {
    --bg: #0e1014;
    --panel: #161920;
    --panel-2: #1d2129;
    --line: #2a2f3a;
    --text: #e3e4ea;
    --muted: #8d92a0;
    --accent: #7f9dff;
    --ok: #57d9a3;
    --warn: #ffb4ab;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 28px; height: 28px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #57d9a3);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0b1020;
  }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .titles p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
    background: rgba(255,255,255,.04); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(87,217,163,.7); }
  .tools { display: flex; gap: 6px; }
  button {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
    font-size: 11px; padding: 6px 10px; border-radius: 9px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  main { position: relative; flex: 1; min-height: 0; background: var(--bg); }
  #terminal { position: absolute; inset: 0; padding: 10px 12px; }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #333a47; border-radius: 4px; }
  .overlay {
    position: absolute; inset: 0; display: none;
    place-items: center; text-align: center; padding: 24px;
    background: rgba(14,16,20,.92); font-size: 12px; color: var(--muted);
  }
  .overlay.show { display: grid; }
  .overlay b { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; }
  footer {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; border-top: 1px solid var(--line);
    background: var(--panel); font-size: 11px; color: var(--muted);
  }
  footer kbd {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; font-size: 10px; color: var(--text);
  }
  textarea.fallback {
    width: 100%; height: 100%; background: #000; color: var(--text);
    border: 0; outline: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; padding: 12px; resize: none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">LT</div>
    <div class="titles">
      <h1>LineTrans Web 终端</h1>
      <p id="hint">连接到手机本地 shell</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
    <div class="tools">
      <button id="btnClear" title="清屏">清屏</button>
      <button id="btnFontDown" title="缩小字体">A-</button>
      <button id="btnFontUp" title="放大字体">A+</button>
      <button id="btnReconnect" title="重新连接">重连</button>
    </div>
  </header>
  <main>
    <div id="terminal"></div>
    <div class="overlay" id="overlay">
      <div>
        <b>连接已断开</b>
        请确认手机端 Web 终端服务仍在运行，然后点击「重连」。
      </div>
    </div>
  </main>
  <footer>
    <span>命令在手机本地 shell（/system/bin/sh）中执行，非 root。</span>
    <span><kbd>Ctrl</kbd>+<kbd>C</kbd> 发送中断</span>
    <span id="sizeInfo"></span>
  </footer>
</div>
<script src="web_terminal/xterm.js"></script>
<script src="web_terminal/addon-fit.js"></script>
<script>
(function () {
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var overlay = document.getElementById('overlay');
  var sizeInfo = document.getElementById('sizeInfo');
  var term = null, fit = null, ws = null, fontSize = 14;

  function setStatus(text, ok) {
    statusText.textContent = text;
    dot.className = 'dot' + (ok ? ' on' : '');
  }

  function useFallback() {
    var host = document.getElementById('terminal');
    host.innerHTML = '';
    var ta = document.createElement('textarea');
    ta.className = 'fallback';
    ta.spellcheck = false;
    ta.placeholder = 'xterm.js 加载失败，简易模式：输入命令后回车执行';
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var lines = ta.value.split('\n');
        var last = lines[lines.length - 1];
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(last);
        ta.value += '\n';
      }
    });
    host.appendChild(ta);
    setStatus('简易模式', true);
  }

  function initXterm() {
    if (typeof Terminal === 'undefined') { useFallback(); return; }
    term = new Terminal({
      cursorBlink: true,
      fontSize: fontSize,
      fontFamily: 'ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace',
      lineHeight: 1.25,
      scrollback: 5000,
      theme: {
        background: '#0e1014',
        foreground: '#e3e4ea',
        cursor: '#7f9dff',
        selectionBackground: 'rgba(127,157,255,.35)',
        black: '#0e1014', brightBlack: '#5b6273',
        red: '#ff8b7d', brightRed: '#ffb4ab',
        green: '#57d9a3', brightGreen: '#8ff0c4',
        yellow: '#ffd479', brightYellow: '#ffe9b0',
        blue: '#7f9dff', brightBlue: '#b6c4ff',
        magenta: '#d0a8ff', brightMagenta: '#e7d4ff',
        cyan: '#7fd9d2', brightCyan: '#b8f0ec',
        white: '#e3e4ea', brightWhite: '#ffffff'
      }
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    safeFit();
    term.onData(function (data) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
    });
    window.addEventListener('resize', safeFit);
  }

  function safeFit() {
    try {
      fit.fit();
      if (term && term.cols) sizeInfo.textContent = term.cols + '×' + term.rows;
    } catch (e) { /* ignore */ }
  }

  function connect() {
    overlay.classList.remove('show');
    if (ws) { try { ws.close(); } catch (e) {} }
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var token = new URLSearchParams(location.search).get('token');
    var wsUrl = proto + location.host + '/ws' + (token ? '?token=' + encodeURIComponent(token) : '');
    ws = new WebSocket(wsUrl);
    setStatus('连接中…', false);
    ws.onopen = function () {
      setStatus('已连接', true);
      if (!term) initXterm();
      safeFit();
    };
    ws.onmessage = function (ev) {
      if (term) term.write(ev.data);
      else {
        var ta = document.querySelector('textarea.fallback');
        if (ta) ta.value += ev.data;
      }
    };
    ws.onclose = function () {
      setStatus('已断开', false);
      overlay.classList.add('show');
      if (term) term.writeln('\r\n\x1b[38;5;245m[连接已断开]\x1b[0m');
    };
    ws.onerror = function () {
      setStatus('连接出错', false);
    };
  }

  document.getElementById('btnClear').addEventListener('click', function () {
    if (term) term.clear();
  });
  document.getElementById('btnFontUp').addEventListener('click', function () {
    fontSize = Math.min(fontSize + 1, 22);
    setFontSize(fontSize);
  });
  document.getElementById('btnFontDown').addEventListener('click', function () {
    fontSize = Math.max(fontSize - 1, 10);
    setFontSize(fontSize);
  });
  function setFontSize(size) {
    if (!term) return;
    try { term.options.fontSize = size; }
    catch (e) { try { term.setOption('fontSize', size); } catch (e2) {} }
    safeFit();
  }
  document.getElementById('btnReconnect').addEventListener('click', connect);

  connect();
})();
</script>
</body>
</html>
