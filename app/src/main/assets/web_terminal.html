<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Web Terminal - 逐行翻译</title>
<link rel="stylesheet" href="web_terminal/xterm.css">
<style>
  html, body { margin: 0; padding: 0; background: #1e1e1e; height: 100%; overflow: hidden; }
  #terminal { width: 100%; height: 100%; padding: 8px; box-sizing: border-box; }
  .fallback { color: #eee; font-family: monospace; padding: 12px; bg-color: #1e1e1e; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="web_terminal/xterm.js"></script>
<script src="web_terminal/addon-fit.js"></script>
<script>
(function () {
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var ws = new WebSocket(proto + location.host + '/ws');
  var term = null;
  var fit = null;

  function useFallback() {
    var d = document.getElementById('terminal');
    d.innerHTML = '<div class="fallback">xterm.js 加载失败，使用简易模式。<br>输入命令后回车执行。</div>';
    var ta = document.createElement('textarea');
    ta.style.cssText = 'width:100%;height:80%;background:#000;color:#eee;font-family:monospace;font-size:14px;';
    ta.spellcheck = false;
    d.appendChild(ta);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var v = ta.value;
        var lines = v.split('\n');
        var last = lines[lines.length - 1];
        ws.send(last);
        ta.value = v + '\n';
      }
    });
  }

  function initXterm() {
    if (typeof Terminal === 'undefined') { useFallback(); return; }
    term = new Terminal({ cursorBlink: true, fontSize: 14, theme: { background: '#1e1e1e' } });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    fit.fit();
    term.onData(function (data) {
      if (ws.readyState === WebSocket.OPEN) ws.send(data);
    });
    window.addEventListener('resize', function () { fit.fit(); });
    term.writeln('已连接 Web 终端。输入命令后回车执行。');
  }

  ws.onopen = function () { initXterm(); };
  ws.onmessage = function (ev) {
    if (term) {
      term.write(ev.data);
    } else {
      var d = document.getElementById('terminal');
      var ta = d.querySelector('textarea');
      if (ta) ta.value += ev.data;
    }
  };
  ws.onclose = function () {
    if (term) term.writeln('\r\n[连接已断开]');
  };
  ws.onerror = function () {
    if (term) term.writeln('\r\n[连接出错]');
  };
})();
</script>
</body>
</html>
